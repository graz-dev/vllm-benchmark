kind: study

name: 2-Larger-Model-G7e
system: vLLM_Benchmark_2_Larger_Model_G7e
workflow: 2-Larger-Model-G7e-Workflow

goal:
  objective: maximize
  function:
    formula: vLLM.prefill_token_throughput + vLLM.decode_token_throughput
  constraints:
    absolute:
      # Carried forward unchanged from 1-goodput-realistic-load — same interactive-chat
      # starting-point thresholds, NOT derived from this study's own data (it hasn't run
      # yet). Recalibrate once this study's own baseline + first sweep-driven trials
      # report real TTFT/ITL numbers for this model/hardware, same as that study did.
      - name: TTFT P95 interactive-chat SLA
        formula: vLLM.time_to_first_token_p95 <= 1500
      - name: ITL P95 interactive-chat SLA
        formula: vLLM.inter_token_latency_p95 <= 300

windowing:
  # CORRECTED 2026-08-23: width lowered from 12 to 6 to actually match
  # 1-goodput-realistic-load's own precedent — that study runs the same 12-level,
  # 300s/level sweep (150->1024, see k8s/05-job.yaml) but itself uses width=6, not
  # width=12 (see its own study YAML comment: "kept at the same value used for
  # earlier 6-level sweeps rather than bumped to 12 to match the sweep's current
  # level count"). This study's original width=12 deviated from that precedent
  # without a stated reason. Still coupled to the sweep, not independent — if the
  # concurrency list is ever recalibrated to a different level count (see study
  # README "Prerequisites still open" #3), revisit this value again.
  type: stability
  stability:
    metric: vLLM.prefill_token_throughput
    width: 6
    maxStdDev: 300000000
    when:
      metric: vLLM.prefill_token_throughput
      is: max

parametersSelection:
  # Same 14 as 1-goodput-realistic-load — see that study's README for the full
  # per-parameter rationale, largely hardware/model-independent.
  - name: vLLM.gpu_memory_utilization
    domain: [0.85, 0.95]
  - name: vLLM.max_num_seqs
    domain: [16, 1024]
  - name: vLLM.max_num_batched_tokens
    domain: [256, 8192]
  - name: vLLM.kv_cache_dtype
    categories: [auto, fp8, fp8_e4m3, fp8_e5m2]
  - name: vLLM.performance_mode
    categories: [balanced, interactivity, throughput]
  - name: vLLM.optimization_level
    domain: [0, 3]
  - name: vLLM.enforce_eager
    categories: ["true", "false"]
  - name: vLLM.scheduling_policy
    categories: [fcfs, priority]
  - name: vLLM.disable_cascade_attn
    categories: ["true", "false"]
  - name: vLLM.tokenizer_mode
    categories: [auto, hf, slow]
  - name: vLLM.async_scheduling
    categories: ["true", "false"]
  - name: vLLM.max_cudagraph_capture_size
    domain: [1, 1024]
  - name: vLLM.block_size
    categories: ["16", "32", "48", "64", "80", "96", "112", "128"]
  - name: vLLM.attention_backend
    categories: [FLASH_ATTN, FLASHINFER, TRITON_ATTN]

# vLLM.spec_method / vLLM.spec_tokens are deliberately absent from BOTH
# parametersSelection and every step's `values` below — same as vLLM.
# prefix_caching_hash_algo and vLLM.compilation_mode. None of the four is referenced by
# k8s/01-deployment_template.yaml, so none of them ever renders for this study at all.

# REMOVED 2026-08-27 (explicit user decision): this study previously carried forward
# all 6 of 1-goodput-realistic-load's parameterConstraints (FLASH_ATTN+kv_cache_dtype,
# FlashInfer+block_size, max_num_batched_tokens>=max_num_seqs, and 3 TRITON_ATTN+fp8
# exclusions root-caused on Ampere/A10G — see git history for the exact formulas). All
# removed so the optimizer explores the full, unconstrained parametersSelection space
# on this hardware (RTX PRO 6000 Blackwell, SM120) — including combinations previously
# excluded as known-invalid on Ampere or by vLLM's own CLI validation. Expect more
# failed experiments as a result (invalid combos now surface as real vLLM startup
# errors instead of being pre-excluded) — `maxFailedExperiments: 200` below has ample
# headroom. Re-add specific constraints here if a failure pattern turns out to be
# common enough to be worth excluding again, informed by what this study's own
# experiments actually hit rather than carried-forward assumptions from other hardware.

steps:
  - name: baseline
    type: baseline
    numberOfTrials: 1
    # NOW MATCHES 1-goodput-realistic-load's baseline design (corrected 2026-08-21 —
    # this step previously pinned all 25 other parameters explicitly via `values`
    # instead; see git history / study README for that superseded design and why it
    # changed: a manual smoke-test deploy against the real vllm/vllm-openai:latest
    # image crashed with "unrecognized arguments: --max-num-partial-prefills=1
    # --max-long-partial-prefills=1" — those two CLI flags no longer exist on this
    # vLLM build, proving pinned-defaultValue rendering is not safe to assume stable
    # across vLLM versions the way this study already treats attention_backend/
    # kv_cache_dtype compatibility).
    #
    # doNotRenderParameters below lists every vLLM.* parameter EXCEPT
    # gpu_memory_utilization — all 13 other tuned parameters plus all 12 pinned
    # parameters referenced by k8s/01-deployment_template.yaml. Every excluded
    # parameter is left unrendered, so vLLM applies its own real defaults for all of
    # them — this is deliberately vLLM's standard, most-tested startup path, and it
    # sidesteps flag-name drift like the partial-prefills incident above: a flag that
    # no longer exists simply never gets rendered onto the command line at baseline.
    #
    # gpu_memory_utilization still needs the explicit `values:` pin (not just "leave
    # it un-excluded and let it render at its pack default") because the pack's own
    # defaultValue for it is 0.92, not the 0.90 this study's baseline wants.
    #
    # HISTORY (superseded 2026-08-27): while this study targeted Qwen/Qwen3.8-27B (a
    # HYBRID Mamba/attention architecture, GDN — Gated DeltaNet), a second incident
    # required also pinning vLLM.max_num_seqs: 256 — left unrendered, vLLM's own
    # auto-selected default (1024) exceeded that model's fixed-size Mamba cache-block
    # budget ("ValueError: max_num_seqs (1024) exceeds available Mamba cache blocks
    # (603)"), a constraint distinct from and additional to the standard KV-cache
    # budget gpu_memory_utilization controls. That pin is REMOVED now that the model
    # is back to Qwen2.5-7B-Instruct (see README "Model swap") — a pure-transformer,
    # non-MoE shape for which "every other parameter at vLLM's own stock default is
    # safe" (1-goodput-realistic-load's original premise) holds again, so
    # vLLM.max_num_seqs is back in doNotRenderParameters below like every other tuned
    # parameter. Both original incidents remain documented in the study README's own
    # "Incidents" section for the record.
    #
    # The workflow's FileConfigurator task sets ignoreUnsubstitutedTokens: true so it
    # doesn't fail on the resulting unsubstituted ${vLLM.*} tokens; apply_config.sh's
    # Step 2 then strips those literal unsubstituted lines from the rendered file
    # before it's applied.
    values:
      vLLM.gpu_memory_utilization: 0.90
    doNotRenderParameters:
      - vLLM.max_num_seqs
      - vLLM.max_num_batched_tokens
      - vLLM.kv_cache_dtype
      - vLLM.performance_mode
      - vLLM.optimization_level
      - vLLM.block_size
      - vLLM.attention_backend
      - vLLM.enforce_eager
      - vLLM.scheduling_policy
      - vLLM.disable_cascade_attn
      - vLLM.tokenizer_mode
      - vLLM.async_scheduling
      - vLLM.max_cudagraph_capture_size
      - vLLM.tensor_parallel_size
      - vLLM.pipeline_parallel_size
      - vLLM.data_parallel_size
      - vLLM.enable_expert_parallel
      - vLLM.disable_custom_all_reduce
      - vLLM.dtype
      - vLLM.decode_context_parallel_size
      - vLLM.prefill_context_parallel_size
      - vLLM.max_num_partial_prefills
      - vLLM.max_long_partial_prefills
      - vLLM.long_prefill_token_threshold
      - vLLM.max_model_len

  - name: optimize
    type: optimize
    numberOfExperiments: 1000
    maxFailedExperiments: 200
