# OPTIONAL — Qwen models are typically ungated on Hugging Face, so this is likely not
# needed for Qwen/Qwen3.8-27B either, same as 1-goodput-realistic-load's Qwen2.5-7B.
# Template — do NOT commit with a real token. Create manually if this study ever
# switches to a gated model:
#
#   kubectl create secret generic hf-token \
#     --from-literal=token=hf_xxxxxxxxxxxxxxxxxxxx \
#     --namespace llm-serving
#
# The account must have accepted that model's license on Hugging Face first.
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: llm-serving
type: Opaque
stringData:
  token: "REPLACE_WITH_YOUR_HF_TOKEN"
