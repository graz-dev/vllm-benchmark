apiVersion: batch/v1
kind: Job
metadata:
  name: aiperf-benchmark
  namespace: llm-benchmark
spec:
  # Do not retry on failure — a failed benchmark should be inspected, not silently retried.
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never

      # Run on the CPU node; the GPU node(s) are tainted exclusively for vLLM.
      nodeSelector:
        node-role: system

      initContainers:
        # Poll vLLM's /health endpoint until the model is fully loaded.
        - name: wait-for-vllm
          image: alpine:3
          command:
            - sh
            - -c
            - |
              until wget -qO- http://vllm.llm-serving.svc.cluster.local:8000/health >/dev/null 2>&1; do
                echo "$(date -u +%T) waiting for vLLM readiness..."
                sleep 10
              done
              echo "vLLM is ready."

      containers:
        # Same tool/version as 1-goodput-realistic-load — see that study's README
        # "Load generator" for the full reasoning (AIPerf's closed-loop --concurrency
        # model is self-limiting near saturation, unlike open-loop rate-based tools).
        - name: aiperf
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - |
              set -e
              pip install --quiet aiperf==0.11.0

              find /benchmarks -mindepth 1 -maxdepth 1 -name 'aiperf-*' -exec rm -rf {} +

              CACHE_FILE=/benchmarks/sharegpt-cache/inputs.json
              if [ ! -f "$CACHE_FILE" ]; then
                echo "No cached ShareGPT inputs.json — generating once (one-time ~5min dataset validation pass)..."
                set +e
                aiperf profile \
                  --model qwen3-8-27b \
                  --tokenizer Qwen/Qwen3.8-27B \
                  --url http://vllm.llm-serving.svc.cluster.local:8000 \
                  --endpoint-type chat \
                  --streaming \
                  --public-dataset sharegpt \
                  --concurrency 1 \
                  --request-count 1 \
                  --ui simple \
                  --output-artifact-dir /tmp/sharegpt-prep
                set -e
                if [ ! -f /tmp/sharegpt-prep/inputs.json ]; then
                  echo "ERROR: prep run did not produce inputs.json — see log above" >&2
                  exit 1
                fi
                mkdir -p /benchmarks/sharegpt-cache
                cp /tmp/sharegpt-prep/inputs.json "$CACHE_FILE"
              else
                echo "Reusing cached ShareGPT inputs.json from $CACHE_FILE (skips dataset validation)."
              fi

              # EXPLORATORY SWEEP (2026-08-23), replacing the carried-forward
              # 150->1024 list — that list's own first level (150) already caused
              # near-total request failure (485,627 of 485,769 sent requests errored
              # in the 300s window) once actually run against this model/hardware,
              # which also OOM-killed this job's own container (see README
              # "Incidents" — AIPerf accumulated in-memory records for that request
              # volume faster than it could process them). Root cause not yet fixed
              # (max_model_len still unrendered at baseline, defaulting to this
              # model's native 262144 context instead of the intended 32768 — left
              # alone for now, per explicit decision) and the sweep itself was never
              # calibrated for this model/hardware to begin with (see README
              # "Prerequisites still open" #3). This list instead explores UP TO the
              # old list's own starting point (150) from much lower, to find where
              # this specific model/hardware/max_model_len=262144 combination
              # actually falls over: 5,15,35,70,110,150 (6 levels), 150s/level = 900s
              # (15min) of load generation — short per-level duration is intentional
              # here (exploratory signal, not a statistically stable baseline number).
              # Once a real ceiling is found, replace this with a proper calibrated
              # list before trusting any `optimize`-step result.
              CONCURRENCY_LIST="5,15,35,70,110,150"

              aiperf profile \
                --model qwen3-8-27b \
                --tokenizer Qwen/Qwen3.8-27B \
                --url http://vllm.llm-serving.svc.cluster.local:8000 \
                --endpoint-type chat \
                --streaming \
                --input-file "$CACHE_FILE" \
                --custom-dataset-type inputs_json \
                --concurrency "$CONCURRENCY_LIST" \
                --benchmark-duration 150 \
                --goodput "time_to_first_token:1500 inter_token_latency:300" \
                --ui simple \
                --output-artifact-dir "/benchmarks/aiperf-$(date +%s)"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true   # only needed for gated models, see 03-hf-secret.yaml
          # Bumped 2026-08-23 (4Gi/8Gi -> 6Gi/12Gi) after this job's container was
          # OOMKilled tracking ~485k mostly-failed request records from the old
          # 150->1024 sweep's first level alone (see the CONCURRENCY_LIST comment
          # above). Node (system, m6i.xlarge) has ~14.36GiB allocatable with only
          # ~2.3GiB already committed elsewhere, so 12Gi leaves comfortable headroom.
          resources:
            requests:
              cpu: "2"
              memory: "6Gi"
            limits:
              memory: "12Gi"
          volumeMounts:
            - name: results
              mountPath: /benchmarks
            - name: hf-cache
              mountPath: /root/.cache/huggingface

      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: aiperf-results
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
