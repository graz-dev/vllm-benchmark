kind: component
system: vLLM_Benchmark_5_Pack_Changes

name: cluster
description: The GPU node (node-role llm-serving), where vLLM itself runs
componentType: Kubernetes Cluster
# Added 2026-09-07, first use of this component type in this repo — needed for the new
# cluster-level PSI metrics (k8s_cluster_*_pressure_*), which come from node-exporter
# and carry no pod/container label, only a node identity. node_role becomes the $NODE_ROLE$
# placeholder used in telemetry/prometheus.yaml's node-join query, matching the
# node-role: llm-serving label already used as this study's GPU nodeSelector
# (see k8s/01-deployment.yaml / k8s/monitoring/dcgm-exporter-values.yaml). See
# `cluster_loadtest` for the equivalent scoped to the load-test's own node instead.
properties:
  prometheus:
    node_role: llm-serving
