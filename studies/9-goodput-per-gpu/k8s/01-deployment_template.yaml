apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm-serving
spec:
  replicas: 1
  # CONFIRMED 2026-08-21 (real manual deploy): Kubernetes' default
  # progressDeadlineSeconds (600s/10min) is shorter than this Deployment's own
  # startupProbe budget (up to 20min for a ~56GB weight load) — the real rollout hit
  # "ProgressDeadlineExceeded" at ~10min while the pod was still legitimately loading
  # (not crashed; Running throughout). This status flag doesn't kill the pod, but
  # `kubectl rollout status` (used by k8s/apply_config.sh) treats it as a failure —
  # in a real Akamas experiment this would fail the "Apply config" task on an
  # otherwise-healthy, just-slow-to-start trial. Set above the startupProbe's own
  # ~20min ceiling (120 x 10s) so the two stay consistent. Not yet checked on the
  # other studies in this repo (none set this field either) — worth revisiting there
  # too if their own startup time is ever close to 10min.
  progressDeadlineSeconds: 1200
  # Recreate terminates the old pod before creating the new one.
  # RollingUpdate (default) would deadlock here: the new pod waits for the GPU
  # held by the old pod, which won't be killed until the new pod is ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
      # ADDED 2026-09-08 with the kv-cache-exporter sidecar below: with 2 containers,
      # `kubectl logs deployment/vllm` (apply_config.sh) needs a default container or it
      # errors out with "a container name must be specified".
      annotations:
        kubectl.kubernetes.io/default-container: vllm
    spec:
      # Prevent Kubernetes from injecting service discovery env vars (e.g. VLLM_PORT=tcp://...)
      # which conflict with vLLM's own VLLM_PORT variable and cause a crash on startup.
      # See: https://docs.vllm.ai/en/stable/serving/env_vars.html
      enableServiceLinks: false

      # Pinned to the NEW llm-serving-l4 node group (g6.12xlarge, 4x NVIDIA L4) —
      # see infra/eks/cluster.yaml. Not yet created on the live cluster as of
      # scaffolding this study (2026-09-07); provision it first (infra/README.md).
      nodeSelector:
        node-role: llm-serving-l4

      # Required to schedule on the tainted GPU node (same taint key/value on both
      # node groups — see infra/eks/cluster.yaml).
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      containers:
        - name: vllm
          # Qwen2.5-7B-Instruct, vllm/vllm-openai:v0.22.0 — identical to
          # 2-larger-model-g7e (same image tag, same goal/parametersSelection/
          # baseline). NOT yet proven on NVIDIA L4/Ada Lovelace (SM89) — this is the
          # first study on this GPU generation in this repo. Smoke-test manually
          # before trusting an Akamas run here (see README "Prerequisites").
          image: vllm/vllm-openai:v0.22.0
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen2.5-7B-Instruct"
            - "--served-model-name=qwen2.5-7b"
            - "--port=8000"
            - "--host=0.0.0.0"
            - "--enable-mfu-metrics"
            # Carried forward from 1-goodput-realistic-load: prefix caching disabled
            # entirely for this study's traffic pattern (see that study's README,
            # "Load generator" — same ShareGPT-replay goodput methodology here).
            - "--no-enable-prefix-caching"

            # --- Tuned (parametersSelection) — same 14 as 1-goodput-realistic-load ---
            - "--gpu-memory-utilization=${vLLM.gpu_memory_utilization}"
            - "--max-num-seqs=${vLLM.max_num_seqs}"
            - "--max-num-batched-tokens=${vLLM.max_num_batched_tokens}"
            - "--kv-cache-dtype=${vLLM.kv_cache_dtype}"
            - "--performance-mode=${vLLM.performance_mode}"
            - "--optimization-level=${vLLM.optimization_level}"
            - "--block-size=${vLLM.block_size}"
            - "--attention-backend=${vLLM.attention_backend}"
            - "--enforce-eager=${vLLM.enforce_eager}"
            - "--scheduling-policy=${vLLM.scheduling_policy}"
            - "--disable-cascade-attn=${vLLM.disable_cascade_attn}"
            - "--tokenizer-mode=${vLLM.tokenizer_mode}"
            - "--async-scheduling=${vLLM.async_scheduling}"
            - "--max-cudagraph-capture-size=${vLLM.max_cudagraph_capture_size}"

            # --- Pinned (single GPU, dense non-MoE model — same reasoning as
            #     1-goodput-realistic-load's Pinned table) ---
            - "--tensor-parallel-size=${vLLM.tensor_parallel_size}"
            - "--pipeline-parallel-size=${vLLM.pipeline_parallel_size}"
            - "--data-parallel-size=${vLLM.data_parallel_size}"
            - "--enable-expert-parallel=${vLLM.enable_expert_parallel}"
            - "--disable-custom-all-reduce=${vLLM.disable_custom_all_reduce}"
            - "--dtype=${vLLM.dtype}"
            - "--decode-context-parallel-size=${vLLM.decode_context_parallel_size}"
            - "--prefill-context-parallel-size=${vLLM.prefill_context_parallel_size}"

            # --- Pinned (carried forward incident-avoidance pins — re-verify these
            #     still apply on Hopper/this model before trusting them, see README) ---
            - "--max-num-partial-prefills=${vLLM.max_num_partial_prefills}"
            - "--max-long-partial-prefills=${vLLM.max_long_partial_prefills}"
            - "--long-prefill-token-threshold=${vLLM.long_prefill_token_threshold}"
            - "--max-model-len=${vLLM.max_model_len}"

            # No --spec-method/--spec-tokens flags here at all — same approach
            # 1-goodput-realistic-load settled on after its 5 spec-decoding crashes
            # trying this on this exact model: the flags are simply omitted, so vLLM
            # runs with speculative decoding off by construction — see README
            # "Parameters tuned".
          # ADDED 2026-08-28 (explicit user decision, first constraint-discovery run):
          # DEBUG logging so the engine's actual resolved config (incl. computed
          # defaults for unrendered parameters, e.g. max_num_seqs when left to vLLM's
          # own choice at baseline) shows up in the pod's own logs instead of staying
          # opaque — see the earlier back-and-forth in this study's history about not
          # being able to confirm the live baseline's resolved max_num_seqs value any
          # other way. Comment out / remove to go back to default (INFO) verbosity.
          env:
            - name: VLLM_LOGGING_LEVEL
              value: DEBUG
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # g6.12xlarge: 48 vCPU / 192GiB RAM / 4x NVIDIA L4 (24GB each, verified via
          # `aws ec2 describe-instance-types`). requests/limits leave ~8 vCPU/~32GiB
          # headroom for kubelet/device-plugin/dcgm-exporter, same margin convention
          # as every other study's GPU node.
          #
          # nvidia.com/gpu: "4" (ALL 4 GPUs on the node) is requested even though this
          # study's baseline (identical to 2-larger-model-g7e) leaves
          # tensor_parallel_size/data_parallel_size unrendered — i.e. vLLM defaults to
          # 1 GPU at baseline, the other 3 sit idle. This is deliberate, not a
          # leftover: the Kubernetes device plugin only exposes as many GPUs to the
          # container as this resource request asks for (sets CUDA_VISIBLE_DEVICES
          # accordingly) — requesting fewer than 4 now would make it impossible to
          # actually test data_parallel_size>1 later without editing this file and
          # redeploying again. Since this is a single dedicated, tainted GPU node
          # (this Deployment is its only workload), reserving all 4 upfront costs
          # nothing.
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "16"
              memory: "64Gi"
            limits:
              nvidia.com/gpu: "4"
              cpu: "40"
              memory: "160Gi"

          # startupProbe allows up to 20 minutes (120 x 10s) — generous relative to
          # 1-goodput-realistic-load's 10-minute budget for the same model on the
          # same hardware, left as-is (no downside to the longer ceiling).
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 60
            failureThreshold: 3

          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /root/.cache/huggingface

        # ADDED 2026-09-08 — KV-cache absolute-metrics exporter sidecar. vLLM exports
        # KV-cache usage only as a ratio (vllm:kv_cache_usage_perc); the capacity exists
        # only as STRING labels on vllm:cache_config_info (num_gpu_blocks, block_size),
        # which PromQL cannot turn into numbers. This sidecar reads vLLM's own /metrics on
        # localhost and republishes capacity/used in tokens and bytes as numeric gauges on
        # :9400 (scraped via 02-service.yaml port `kv-exporter` + monitoring/
        # servicemonitor.yaml; consumed by the vLLM pack 1.7.0 kv_cache_*_tokens/_gb
        # metrics). Script: 04-kv-cache-exporter-configmap.yaml — a ConfigMap on
        # purpose, since this template is rendered by FileConfigurator and sed-processed
        # by apply_config.sh. No readiness probe by design (the rollout must not wait on
        # the sidecar); no ${vLLM.*} tokens in this block by design (apply_config.sh
        # Step 2 deletes any line containing one). No GPU requested — CPU-only.
        - name: kv-cache-exporter
          image: python:3.12-alpine
          command: ["python3", "-u", "/app/kv_cache_exporter.py"]
          env:
            - name: VLLM_METRICS_URL
              value: http://127.0.0.1:8000/metrics
            - name: EXPORTER_PORT
              value: "9400"
            - name: POLL_INTERVAL_SECONDS
              value: "5"
            # KV bytes per token = 2 (K and V) x layers x KV heads x head_dim x dtype
            # bytes. Qwen/Qwen2.5-7B-Instruct (HF config.json, fetched 2026-09-08):
            # num_hidden_layers=28, num_key_value_heads=4, head_dim=hidden_size/heads=
            # 3584/28=128, torch_dtype=bfloat16 (2 bytes) -> 57344 bytes/token. Assumes
            # kv_cache_dtype stays unrendered in this study (auto -> bf16; an fp8 KV
            # cache would halve this) and TP <= 4 (4 KV heads are sharded, not
            # replicated, so the total is TP-invariant). ONLY the *_bytes gauges depend
            # on these — the token gauges are vLLM's own numbers. Update for any other
            # model.
            - name: MODEL_NUM_LAYERS
              value: "28"
            - name: MODEL_NUM_KV_HEADS
              value: "4"
            - name: MODEL_HEAD_DIM
              value: "128"
            - name: KV_CACHE_DTYPE_BYTES
              value: "2"
          ports:
            - name: kv-exporter
              containerPort: 9400
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: kv-cache-exporter
              mountPath: /app
              readOnly: true

      volumes:
        # vLLM uses shared memory for CUDA IPC handles between workers.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 12Gi
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        # ADDED 2026-09-08 — see the kv-cache-exporter sidecar above; apply
        # 04-kv-cache-exporter-configmap.yaml once before the first trial.
        - name: kv-cache-exporter
          configMap:
            name: kv-cache-exporter
            defaultMode: 0444
