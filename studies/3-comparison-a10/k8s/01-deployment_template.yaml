apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: llm-serving
spec:
  replicas: 1
  # CONFIRMED 2026-08-21 (real manual deploy): Kubernetes' default
  # progressDeadlineSeconds (600s/10min) is shorter than this Deployment's own
  # startupProbe budget (up to 20min for a ~56GB weight load) — the real rollout hit
  # "ProgressDeadlineExceeded" at ~10min while the pod was still legitimately loading
  # (not crashed; Running throughout). This status flag doesn't kill the pod, but
  # `kubectl rollout status` (used by k8s/apply_config.sh) treats it as a failure —
  # in a real Akamas experiment this would fail the "Apply config" task on an
  # otherwise-healthy, just-slow-to-start trial. Set above the startupProbe's own
  # ~20min ceiling (120 x 10s) so the two stay consistent. Not yet checked on the
  # other studies in this repo (none set this field either) — worth revisiting there
  # too if their own startup time is ever close to 10min.
  progressDeadlineSeconds: 1200
  # Recreate terminates the old pod before creating the new one.
  # RollingUpdate (default) would deadlock here: the new pod waits for the GPU
  # held by the old pod, which won't be killed until the new pod is ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Prevent Kubernetes from injecting service discovery env vars (e.g. VLLM_PORT=tcp://...)
      # which conflict with vLLM's own VLLM_PORT variable and cause a crash on startup.
      # See: https://docs.vllm.ai/en/stable/serving/env_vars.html
      enableServiceLinks: false

      # CHANGED for 3-comparison-a10: pin to the EXISTING A10G node group
      # (llm-serving, from 0-explorative/1-goodput-realistic-load) instead of
      # 2-larger-model-g7e's own llm-serving-g7e group — this study exists
      # specifically to re-run 2-larger-model-g7e's exact config on A10G/Ampere for a
      # direct hardware comparison, so the node group is the one deliberate
      # difference. Same cluster (vllm-bench), same namespace (llm-serving), reused
      # as-is. Turn the A10G node group back on (desiredCapacity 0->1) before running
      # — see infra/README.md.
      nodeSelector:
        node-role: llm-serving

      # Required to schedule on the tainted GPU node (same taint key/value on both
      # node groups — see infra/eks/cluster.yaml).
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      containers:
        - name: vllm
          # Qwen2.5-7B-Instruct, vllm/vllm-openai:v0.22.0 — identical to
          # 2-larger-model-g7e (same model swap, same image tag; see that study's
          # README "Model swap" for the full history). Already proven to work on
          # A10G/Ampere (0-explorative/1-goodput-realistic-load use this exact
          # image+model), so no smoke test needed before trusting an Akamas run here.
          image: vllm/vllm-openai:v0.22.0
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen2.5-7B-Instruct"
            - "--served-model-name=qwen2.5-7b"
            - "--port=8000"
            - "--host=0.0.0.0"
            - "--enable-mfu-metrics"
            # Carried forward from 1-goodput-realistic-load: prefix caching disabled
            # entirely for this study's traffic pattern (see that study's README,
            # "Load generator" — same ShareGPT-replay goodput methodology here).
            - "--no-enable-prefix-caching"

            # --- Tuned (parametersSelection) — same 14 as 1-goodput-realistic-load ---
            - "--gpu-memory-utilization=${vLLM.gpu_memory_utilization}"
            - "--max-num-seqs=${vLLM.max_num_seqs}"
            - "--max-num-batched-tokens=${vLLM.max_num_batched_tokens}"
            - "--kv-cache-dtype=${vLLM.kv_cache_dtype}"
            - "--performance-mode=${vLLM.performance_mode}"
            - "--optimization-level=${vLLM.optimization_level}"
            - "--block-size=${vLLM.block_size}"
            - "--attention-backend=${vLLM.attention_backend}"
            - "--enforce-eager=${vLLM.enforce_eager}"
            - "--scheduling-policy=${vLLM.scheduling_policy}"
            - "--disable-cascade-attn=${vLLM.disable_cascade_attn}"
            - "--tokenizer-mode=${vLLM.tokenizer_mode}"
            - "--async-scheduling=${vLLM.async_scheduling}"
            - "--max-cudagraph-capture-size=${vLLM.max_cudagraph_capture_size}"

            # --- Pinned (single GPU, dense non-MoE model — same reasoning as
            #     1-goodput-realistic-load's Pinned table) ---
            - "--tensor-parallel-size=${vLLM.tensor_parallel_size}"
            - "--pipeline-parallel-size=${vLLM.pipeline_parallel_size}"
            - "--data-parallel-size=${vLLM.data_parallel_size}"
            - "--enable-expert-parallel=${vLLM.enable_expert_parallel}"
            - "--disable-custom-all-reduce=${vLLM.disable_custom_all_reduce}"
            - "--dtype=${vLLM.dtype}"
            - "--decode-context-parallel-size=${vLLM.decode_context_parallel_size}"
            - "--prefill-context-parallel-size=${vLLM.prefill_context_parallel_size}"

            # --- Pinned (carried forward incident-avoidance pins — re-verify these
            #     still apply on Hopper/this model before trusting them, see README) ---
            - "--max-num-partial-prefills=${vLLM.max_num_partial_prefills}"
            - "--max-long-partial-prefills=${vLLM.max_long_partial_prefills}"
            - "--long-prefill-token-threshold=${vLLM.long_prefill_token_threshold}"
            - "--max-model-len=${vLLM.max_model_len}"

            # No --spec-method/--spec-tokens flags here at all — same approach
            # 1-goodput-realistic-load settled on after its 5 spec-decoding crashes
            # trying this on this exact model: the flags are simply omitted, so vLLM
            # runs with speculative decoding off by construction — see README
            # "Parameters tuned".
          # ADDED 2026-08-28 (explicit user decision, first constraint-discovery run):
          # DEBUG logging so the engine's actual resolved config (incl. computed
          # defaults for unrendered parameters, e.g. max_num_seqs when left to vLLM's
          # own choice at baseline) shows up in the pod's own logs instead of staying
          # opaque — see the earlier back-and-forth in this study's history about not
          # being able to confirm the live baseline's resolved max_num_seqs value any
          # other way. Comment out / remove to go back to default (INFO) verbosity.
          env:
            - name: VLLM_LOGGING_LEVEL
              value: DEBUG
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # CHANGED for 3-comparison-a10: g5.2xlarge (A10G) has only 32GiB total RAM —
          # 2-larger-model-g7e's 32Gi/100Gi values (sized for g7e.4xlarge's 128GiB)
          # would never schedule here. Matches 1-goodput-realistic-load's own values
          # exactly (that study already runs this same model on this same node group).
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: "16Gi"
            limits:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "28Gi"

          # startupProbe allows up to 20 minutes (120 x 10s) — generous relative to
          # 1-goodput-realistic-load's 10-minute budget for the same model on the
          # same hardware, left as-is (no downside to the longer ceiling).
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 60
            failureThreshold: 3

          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /root/.cache/huggingface

      volumes:
        # vLLM uses shared memory for CUDA IPC handles between workers.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 12Gi
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
