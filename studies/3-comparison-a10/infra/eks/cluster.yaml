apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: vllm-bench
  region: us-east-2
  version: "1.35"
  tags:
    Project: vllm-bench
    Provisioner: eksctl

iam:
  withOIDC: true

addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

managedNodeGroups:

  - name: system
    instanceType: m6i.xlarge
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 50
    labels:
      node-role: system

  - name: akamas
    instanceType: r6i.xlarge
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 50
    labels:
      node-role: akamas

  # 3-comparison-a10 deliberately reuses this EXACT node group as-is — no new group
  # added, unlike 2-larger-model-g7e (which added its own llm-serving-g7e group for
  # different hardware). This study exists specifically to re-run that study's exact
  # config back on this A10G/Ampere group for a direct hardware comparison, so the
  # node group must be identical to 0-explorative/1-goodput-realistic-load's, not a
  # new one. Turn it back on (desiredCapacity 0->1) before running if it's currently
  # scaled down — see infra/README.md.
  - name: llm-serving
    instanceType: g5.2xlarge
    desiredCapacity: 1
    minSize: 0
    maxSize: 1
    volumeSize: 100
    amiFamily: AmazonLinux2023
    labels:
      node-role: llm-serving
    taints:
      - key: nvidia.com/gpu
        value: "present"
        effect: NoSchedule
