apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: vllm-bench
  region: us-east-2
  version: "1.35"
  tags:
    Project: vllm-bench
    Provisioner: eksctl

iam:
  withOIDC: true

addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

managedNodeGroups:

  - name: system
    instanceType: m6i.xlarge
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 50
    labels:
      node-role: system

  - name: akamas
    instanceType: r6i.xlarge
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 50
    labels:
      node-role: akamas

  - name: llm-serving
    instanceType: g5.2xlarge
    desiredCapacity: 1
    minSize: 0
    maxSize: 1
    volumeSize: 100
    amiFamily: AmazonLinux2023
    labels:
      node-role: llm-serving
    taints:
      - key: nvidia.com/gpu
        value: "present"
        effect: NoSchedule

  # Added for studies/2-larger-model-h100 (2026-08-20) — a separate node group from
  # the existing A10G `llm-serving` group above, so this study's H100 workload never
  # contends with or displaces 0-explorative/1-goodput-realistic-load's own node.
  # Same cluster (`vllm-bench`), same region — this study deliberately reuses the
  # cluster rather than provisioning a standalone one (explicit user decision).
  - name: llm-serving-h100
    instanceType: p5.4xlarge
    desiredCapacity: 1
    minSize: 0
    maxSize: 1
    volumeSize: 200
    amiFamily: AmazonLinux2023
    labels:
      node-role: llm-serving-h100
    taints:
      - key: nvidia.com/gpu
        value: "present"
        effect: NoSchedule
