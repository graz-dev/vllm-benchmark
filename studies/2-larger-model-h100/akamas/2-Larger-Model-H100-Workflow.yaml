kind: workflow

name: 2-Larger-Model-H100-Workflow
tasks:
  - name: Write config
    operator: FileConfigurator
    arguments:
      # No ignoreUnsubstitutedTokens here, unlike 1-goodput-realistic-load's workflow —
      # that study's baseline step deliberately left most ${vLLM.*} tokens unrendered
      # (doNotRenderParameters). This study's baseline instead pins every referenced
      # parameter explicitly in `values` (see 2-Larger-Model-H100.yaml) and every
      # ${vLLM.*} token in the deployment template corresponds to a parameter that's
      # always either pinned (baseline) or tuned (optimize) — so no token is ever left
      # unsubstituted, and FileConfigurator's default (fail on unsubstituted tokens) is
      # fine as-is.
      source:
        hostname: toolbox
        username: akamas
        key: /work/vllm-benchmark/studies/2-larger-model-h100/akamas/id_rsa
        path: /work/vllm-benchmark/studies/2-larger-model-h100/k8s/01-deployment_template.yaml
      target:
        hostname: toolbox
        username: akamas
        key: /work/vllm-benchmark/studies/2-larger-model-h100/akamas/id_rsa
        path: /work/vllm-benchmark/studies/2-larger-model-h100/k8s/01-deployment.yaml

  - name: Apply config
    operator: Executor
    arguments:
      retries: 0
      # Longer than 1-goodput-realistic-load's 60m — this model's startupProbe alone
      # budgets up to 20min (vs. that study's 10min) for a ~56GB weight load.
      timeout: 75m
      host:
        hostname: toolbox
        username: akamas
        key: /work/vllm-benchmark/studies/2-larger-model-h100/akamas/id_rsa
      command: bash /work/vllm-benchmark/studies/2-larger-model-h100/k8s/apply_config.sh

  - name: RunTest
    operator: Executor
    arguments:
      # k8s/run_test_goodput.sh itself waits up to 4500s (75m); this task's own timeout
      # gives 15min margin above that, matching 1-goodput-realistic-load's convention.
      retries: 0
      timeout: 90m
      host:
        hostname: toolbox
        username: akamas
        key: /work/vllm-benchmark/studies/2-larger-model-h100/akamas/id_rsa
      command: bash /work/vllm-benchmark/studies/2-larger-model-h100/k8s/run_test_goodput.sh
